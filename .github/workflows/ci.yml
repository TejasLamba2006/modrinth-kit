name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx tsx scripts/gen-docs.ts --check
      - run: npx -y @anthropic-ai/claude-code@latest plugin validate . || echo "::warning::plugin validate unavailable"
      - run: npm run build && node dist/cli/index.js ops > /dev/null
